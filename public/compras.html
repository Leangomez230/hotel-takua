<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Compras — Hotel Takuá</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00c9b1">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--sidebar:#1a2035;--sw:72px;--accent:#00c9b1}
body{font-family:'Nunito',sans-serif;background:#f0f4f8;color:#1a2035;font-size:14px;overflow-x:hidden}

.main{margin-left:var(--sw);display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#fff;padding:12px 22px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e8edf3;position:sticky;top:0;z-index:100}
.hamburger{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1.5px solid #e2e8f0;background:#f8fafc;font-size:18px;cursor:pointer;flex-shrink:0}
.tb-left{flex:1;min-width:0}
.tb-left h2{font-size:16px;font-weight:800;color:#1a2035;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-left p{font-size:11px;color:#94a3b8;margin-top:1px}
.tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.content{padding:20px 24px;max-width:1400px;margin:0 auto;width:100%}
.user-av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.btn-salir{background:none;border:1.5px solid #e2e8f0;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700;color:#dc2626;cursor:pointer;font-family:'Nunito',sans-serif}
.section-card{background:#fff;border-radius:18px;padding:22px 24px;box-shadow:0 1px 8px rgba(0,0,0,.07);margin-bottom:20px}
.sc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.card-title{font-size:16px;font-weight:800;color:#1a2035}
.tabs{display:flex;gap:6px;background:transparent;border-radius:12px;padding:0;margin-bottom:20px;flex-wrap:wrap}
.tab{flex:1;min-width:80px;padding:10px 14px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:#64748b;cursor:pointer;transition:all .15s;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab:hover{background:#f8fafc;color:#1a2035;border-color:#cbd5e1}
.tab.active{background:linear-gradient(135deg,#1a2035,#2d3a5c);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(26,32,53,.25)}
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;padding:10px 12px;font-size:11px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #f1f5f9}
.data-table td{padding:10px 12px;border-bottom:1px solid #f8fafc;font-size:13px;vertical-align:middle}
.data-table tbody tr:hover{background:#f8fafc}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700}
.pg{background:#dcfce7;color:#16a34a}.pr{background:#fee2e2;color:#dc2626}
.py{background:#fef9c3;color:#b45309}.pb{background:#dbeafe;color:#1d4ed8}
.pgr{background:#f3f4f6;color:#374151}
.form-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.form-col{flex:1;min-width:140px;display:flex;flex-direction:column;gap:5px}
.form-col label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.3px}
.form-col input,.form-col select,.form-col textarea{border:1.5px solid #e0e6ef;border-radius:9px;padding:9px 11px;font-size:13px;font-family:'Nunito',sans-serif;width:100%;transition:border .15s}
.form-col input:focus,.form-col select:focus,.form-col textarea:focus{outline:none;border-color:var(--accent)}
.form-col textarea{resize:vertical;min-height:60px}
.stitle{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#0094ff);border:none;border-radius:10px;padding:10px 18px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif}
.btn-secondary{background:#f1f5f9;border:1.5px solid #e2e8f0;border-radius:10px;padding:9px 16px;color:#475569;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif}
.btn-danger{background:#fee2e2;border:1.5px solid #fecdd3;border-radius:10px;padding:9px 14px;color:#dc2626;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif}
.btn-sm{border:none;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif}
.confirm-btn{width:100%;background:linear-gradient(135deg,var(--accent),#0094ff);border:none;border-radius:12px;padding:14px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;margin-top:6px}
.confirm-btn:disabled{opacity:.5;cursor:not-allowed}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:22px 20px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-hd h3{font-size:17px;font-weight:800;color:#1a2035}
.modal-close{background:#f1f5f9;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:18px;color:#64748b}
.filtro-pill{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;border:1.5px solid #e2e8f0;background:#fff;color:#475569;transition:all .15s}
.filtro-pill.active{border-color:var(--accent);background:#f0fdf9;color:#0f766e}

/* ── Ítems de la compra ── */
.item-row{background:#f8fafc;border:1.5px solid #e8edf3;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item-row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.item-toggle{display:flex;gap:4px;background:#e8edf3;border-radius:8px;padding:2px}
.item-toggle button{border:none;background:transparent;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;color:#64748b;cursor:pointer;font-family:'Nunito',sans-serif}
.item-toggle button.active{background:#fff;color:#0f766e;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.item-remove{background:none;border:none;color:#dc2626;cursor:pointer;font-size:16px;padding:2px 6px}
.item-search-wrap{position:relative}
.item-search-results{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.12);max-height:220px;overflow-y:auto;z-index:50;margin-top:4px}
.item-search-opt{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f1f5f9}
.item-search-opt:hover{background:#f0fdf9}
.item-search-opt small{display:block;color:#94a3b8;font-size:11px;margin-top:1px}
.item-subtotal{text-align:right;font-weight:800;color:#1a2035;font-size:13px;margin-top:6px}
.total-box{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:14px 4px 4px;border-top:2px solid #f1f5f9;margin-top:6px}
.total-box .lbl{font-size:13px;color:#64748b;font-weight:700}
.total-box .val{font-size:22px;font-weight:900;color:#1a2035}

@media(max-width:900px){
  :root{--sw:0px}
  .main{margin-left:0!important}
  #hamburger{display:flex!important}
  .content{padding:12px 10px}
}
@media(max-width:600px){
  .form-row{flex-direction:column;gap:8px}
  input,select{font-size:16px!important}
  .tab{font-size:11px;padding:7px 8px}
}
</style>
</head>
<body>

<div class="main">
  <div class="topbar">
    <button class="hamburger" id="hamburger">☰</button>
    <div class="tb-left">
      <h2>🛒 Compras — Hotel Takuá</h2>
      <p id="tb-user">Administrador</p>
    </div>
    <div class="tb-right">
      <div class="user-av" id="user-av">A</div>
      <button class="btn-salir" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="content" id="main-content">
    <div style="text-align:center;padding:60px;color:#94a3b8;font-size:16px">⏳ Cargando compras...</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal-body"></div>
</div>

<script>
// ── AUTH ─────────────────────────────────────────────
const TOKEN = localStorage.getItem('takua_token');
const ME    = JSON.parse(localStorage.getItem('takua_user') || 'null');
if (!TOKEN || !ME) window.location.href = '/portal.html';
if (ME && !['admin','recepcionista'].includes(ME.rol)) window.location.href = '/index.html';
const IS_ADMIN = ME && ME.rol === 'admin';

document.getElementById('user-av').textContent = (ME?.nombre||'A')[0].toUpperCase();
document.getElementById('tb-user').textContent  = (IS_ADMIN?'Admin':'Recepción') + ' · ' + (ME?.nombre||'');

function doLogout() {
  localStorage.removeItem('takua_token');
  localStorage.removeItem('takua_user');
  window.location.href = '/portal.html';
}

// ── API ───────────────────────────────────────────────
async function api(method, path, body) {
  try {
    const r = await fetch('/api'+path, {
      method,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
      body: body ? JSON.stringify(body) : undefined
    });
    return r.json();
  } catch(e) { return {error:e.message}; }
}

// ── UTILS ─────────────────────────────────────────────
const fmt = n => n==null ? '—' : new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:0,maximumFractionDigits:0}).format(n);
const fmtDate = iso => iso ? new Date(iso+(iso.length===10?'T00:00:00':'')).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
const hoy = () => new Date().toISOString().slice(0,10);

function toast(msg, ok=true) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:'
    +(ok?'#1a2035':'#dc2626')+';color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;'
    +'font-size:13px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.3);font-family:Nunito,sans-serif;white-space:nowrap';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function openModal(html) {
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeModal();
});

// ── ESTADO ────────────────────────────────────────────
let ITEM_SEQ = 0;
const G = {
  tab: 'nueva',
  proveedores: [],
  productos: [],
  itemsForm: [],           // ítems de la compra en curso
  comprobante: null,       // compra recién creada, para mostrar tras confirmar
  historial: [],
  filtroDesde: '', filtroHasta: '', filtroProveedor: '', filtroEstado: '',
};

function nuevoItem(vinculado=true) {
  ITEM_SEQ++;
  return { seq: ITEM_SEQ, vinculado, producto_id:null, nombre:'', unidad:'unidad', cantidad:1, costo_unitario:0, notas:'' };
}

// ── CARGA INICIAL ─────────────────────────────────────
async function loadBase() {
  const [prov, prod] = await Promise.all([
    api('GET','/proveedores'),
    api('GET','/inventario/productos'),
  ]);
  G.proveedores = Array.isArray(prov) ? prov : [];
  G.productos   = Array.isArray(prod) ? prod : [];
}

async function render() {
  await loadBase();
  if (!G.itemsForm.length && !G.comprobante) G.itemsForm = [nuevoItem()];
  document.getElementById('main-content').innerHTML =
    '<div class="tabs">'
    +'<button class="tab '+(G.tab==='nueva'?'active':'')+'" onclick="setTab(\'nueva\')">➕ Nueva compra</button>'
    +'<button class="tab '+(G.tab==='historial'?'active':'')+'" onclick="setTab(\'historial\')">📋 Historial</button>'
    +'<button class="tab '+(G.tab==='proveedores'?'active':'')+'" onclick="setTab(\'proveedores\')">🏢 Proveedores</button>'
    +'</div>'
    +'<div id="tab-content"></div>';
  renderTab();
}

function setTab(tab) {
  G.tab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['nueva','historial','proveedores'][i]===tab);
  });
  renderTab();
}

function renderTab() {
  const el = document.getElementById('tab-content');
  if (!el) return;
  if (G.tab==='nueva')            renderTabNueva(el);
  else if (G.tab==='historial')   renderTabHistorial(el);
  else                            renderTabProveedores(el);
}

// ══════════════════════════════════════════════════════
// TAB: NUEVA COMPRA
// ══════════════════════════════════════════════════════
function renderTabNueva(el) {
  if (G.comprobante) { renderComprobanteView(el, G.comprobante); return; }

  const optsProveedor = G.proveedores.map(p=>'<option value="'+p.id+'">'+p.nombre+'</option>').join('');

  el.innerHTML = '<div class="section-card">'
    +'<div class="sc-head"><span class="card-title">Datos de la compra</span>'
    +(IS_ADMIN ? '<button class="btn-secondary" onclick="modalNuevoProveedor(true)">+ Nuevo proveedor</button>' : '')
    +'</div>'
    +'<div class="form-row">'
    +'<div class="form-col"><label>Proveedor *</label><select id="nc-proveedor">'
    +'<option value="">Seleccionar...</option>'+optsProveedor+'</select></div>'
    +'<div class="form-col"><label>Nº Factura</label><input id="nc-factura" placeholder="A-0001-00001234"></div>'
    +'<div class="form-col"><label>Nº Remito</label><input id="nc-remito" placeholder="R-0001-00005678"></div>'
    +'</div>'
    +'<div class="form-row">'
    +'<div class="form-col"><label>Fecha de emisión</label><input type="date" id="nc-emision"></div>'
    +'<div class="form-col"><label>Fecha de recepción</label><input type="date" id="nc-recepcion" value="'+hoy()+'"></div>'
    +'</div>'
    +'<div class="form-col"><label>Observaciones</label><textarea id="nc-obs" placeholder="Opcional"></textarea></div>'
    +'</div>'

    +'<div class="section-card">'
    +'<div class="sc-head"><span class="card-title">Ítems recibidos</span>'
    +'<button class="btn-secondary" onclick="agregarItem()">+ Agregar ítem</button></div>'
    +'<div id="items-list"></div>'
    +'<div class="total-box"><span class="lbl">Total compra</span><span class="val" id="nc-total">'+fmt(0)+'</span></div>'
    +'</div>'

    +'<button class="confirm-btn" id="btn-finalizar" onclick="finalizarCompra()">✅ Finalizar compra</button>';

  document.getElementById('nc-proveedor').value = G.proveedorSeleccionado || '';
  renderItemsList();
}

function renderItemsList() {
  const wrap = document.getElementById('items-list');
  if (!wrap) return;
  wrap.innerHTML = G.itemsForm.map(it => itemRowHTML(it)).join('');
  actualizarTotalNueva();
}

function itemRowHTML(it) {
  const subtotal = (Number(it.cantidad)||0) * (Number(it.costo_unitario)||0);
  return '<div class="item-row" data-seq="'+it.seq+'">'
    +'<div class="item-row-head">'
    +'<div class="item-toggle">'
    +'<button class="'+(it.vinculado?'active':'')+'" onclick="setItemVinculado('+it.seq+',true)">📦 Vinculado a stock</button>'
    +'<button class="'+(!it.vinculado?'active':'')+'" onclick="setItemVinculado('+it.seq+',false)">✏️ Libre</button>'
    +'</div>'
    +(G.itemsForm.length>1 ? '<button class="item-remove" onclick="quitarItem('+it.seq+')">✕</button>' : '')
    +'</div>'

    +(it.vinculado
      ? '<div class="item-search-wrap">'
        +'<input placeholder="Buscar producto del inventario..." value="'+(it.nombre||'').replace(/"/g,'&quot;')+'" '
        +'oninput="buscarProducto('+it.seq+',this.value)" onfocus="buscarProducto('+it.seq+',this.value)" '
        +'onblur="setTimeout(()=>cerrarBusqueda('+it.seq+'),150)">'
        +'<div class="item-search-results" id="search-'+it.seq+'" style="display:none"></div>'
        +'</div>'
      : '<input placeholder="Nombre del producto" value="'+(it.nombre||'').replace(/"/g,'&quot;')+'" '
        +'oninput="setItemCampo('+it.seq+',\'nombre\',this.value)" style="margin-bottom:8px;border:1.5px solid #e0e6ef;border-radius:9px;padding:9px 11px;font-size:13px;width:100%;font-family:Nunito,sans-serif">'
    )

    +'<div class="form-row" style="margin-top:8px;margin-bottom:0">'
    +'<div class="form-col"><label>Cantidad</label><input type="number" min="0" step="any" value="'+it.cantidad+'" oninput="setItemCampo('+it.seq+',\'cantidad\',this.value)"></div>'
    +'<div class="form-col"><label>Unidad</label><input value="'+(it.unidad||'unidad')+'" oninput="setItemCampo('+it.seq+',\'unidad\',this.value)" '+(it.vinculado?'readonly style="background:#f1f5f9"':'')+'></div>'
    +'<div class="form-col"><label>Costo unitario</label><input type="number" min="0" step="any" value="'+it.costo_unitario+'" oninput="setItemCampo('+it.seq+',\'costo_unitario\',this.value)"></div>'
    +'</div>'
    +'<div class="item-subtotal">Subtotal: '+fmt(subtotal)+'</div>'
    +'</div>';
}

function agregarItem() { G.itemsForm.push(nuevoItem()); renderItemsList(); }
function quitarItem(seq) { G.itemsForm = G.itemsForm.filter(i=>i.seq!==seq); renderItemsList(); }

function getItem(seq) { return G.itemsForm.find(i=>i.seq===seq); }

function setItemVinculado(seq, val) {
  const it = getItem(seq); if (!it) return;
  it.vinculado = val;
  it.producto_id = null;
  it.nombre = '';
  if (val) it.unidad = 'unidad';
  renderItemsList();
}

function setItemCampo(seq, campo, val) {
  const it = getItem(seq); if (!it) return;
  it[campo] = campo==='cantidad'||campo==='costo_unitario' ? val : val;
  // Solo actualizamos el subtotal/total sin re-renderizar todo (así no se pierde el foco del input)
  const row = document.querySelector('.item-row[data-seq="'+seq+'"] .item-subtotal');
  if (row) {
    const subtotal = (Number(it.cantidad)||0) * (Number(it.costo_unitario)||0);
    row.textContent = 'Subtotal: ' + fmt(subtotal);
  }
  actualizarTotalNueva();
}

function actualizarTotalNueva() {
  const total = G.itemsForm.reduce((s,it)=> s + (Number(it.cantidad)||0)*(Number(it.costo_unitario)||0), 0);
  const el = document.getElementById('nc-total');
  if (el) el.textContent = fmt(total);
}

function buscarProducto(seq, q) {
  const box = document.getElementById('search-'+seq);
  if (!box) return;
  const it = getItem(seq);
  if (it) it.nombre = q; // lo que se ve en el input, aunque todavía no eligió
  if (!q || !q.trim()) { box.style.display='none'; return; }
  const ql = q.toLowerCase();
  const matches = G.productos.filter(p=>p.nombre.toLowerCase().includes(ql)).slice(0,8);
  if (!matches.length) { box.innerHTML = '<div class="item-search-opt" style="color:#94a3b8">Sin resultados — probá "Libre" si no está en inventario</div>'; box.style.display='block'; return; }
  box.innerHTML = matches.map(p=>'<div class="item-search-opt" onmousedown="elegirProducto('+seq+','+p.id+')">'
    +p.nombre+'<small>'+(p.categoria||'—')+' · Stock actual: '+p.stock+' '+(p.unidad||'u')+' · Costo: '+fmt(p.costo||0)+'</small></div>').join('');
  box.style.display = 'block';
}
function cerrarBusqueda(seq) { const box = document.getElementById('search-'+seq); if (box) box.style.display='none'; }

function elegirProducto(seq, productoId) {
  const it = getItem(seq); if (!it) return;
  const p = G.productos.find(x=>x.id===productoId); if (!p) return;
  it.producto_id = p.id;
  it.nombre = p.nombre;
  it.unidad = p.unidad || 'unidad';
  it.costo_unitario = Number(p.costo) || it.costo_unitario || 0;
  renderItemsList();
}

async function finalizarCompra() {
  const proveedor_id = document.getElementById('nc-proveedor').value;
  if (!proveedor_id) return toast('Elegí un proveedor', false);
  if (!G.itemsForm.length) return toast('Agregá al menos un ítem', false);
  for (const it of G.itemsForm) {
    if (!it.nombre || !it.nombre.trim()) return toast('Hay un ítem sin nombre', false);
    if (!(Number(it.cantidad) > 0)) return toast('Hay un ítem con cantidad inválida: '+it.nombre, false);
    if (it.vinculado && !it.producto_id) return toast('"'+it.nombre+'" está marcado como vinculado pero no elegiste el producto de la lista', false);
  }

  const btn = document.getElementById('btn-finalizar');
  btn.disabled = true; btn.textContent = 'Guardando...';

  const body = {
    proveedor_id: Number(proveedor_id),
    numero_factura: document.getElementById('nc-factura').value.trim(),
    numero_remito: document.getElementById('nc-remito').value.trim(),
    fecha_emision: document.getElementById('nc-emision').value || null,
    fecha_recepcion: document.getElementById('nc-recepcion').value || hoy(),
    observaciones: document.getElementById('nc-obs').value.trim(),
    items: G.itemsForm.map(it => ({
      producto_id: it.vinculado ? it.producto_id : null,
      nombre: it.nombre.trim(),
      cantidad: Number(it.cantidad),
      unidad: it.unidad || 'unidad',
      costo_unitario: Number(it.costo_unitario)||0,
      notas: it.notas||'',
    })),
  };

  const r = await api('POST','/compras', body);
  if (r.error) { toast(r.error, false); btn.disabled=false; btn.textContent='✅ Finalizar compra'; return; }

  toast('Compra #'+r.compra.id+' registrada');
  G.comprobante = r.compra;
  G.itemsForm = [];
  renderTab();
}

function nuevaCompraDesdeComprobante() {
  G.comprobante = null;
  G.itemsForm = [nuevoItem()];
  renderTab();
}

// ── COMPROBANTE (vista + impresión) ───────────────────
function renderComprobanteView(el, compra) {
  const anulada = compra.estado === 'anulada';
  el.innerHTML = '<div class="section-card">'
    +(anulada ? '<div style="background:#fee2e2;border:1.5px solid #fca5a5;border-radius:10px;padding:10px 14px;margin-bottom:16px;color:#dc2626;font-weight:800">⚠️ Esta compra está ANULADA'
      +(compra.motivo_anulacion?' — '+compra.motivo_anulacion:'')+'</div>' : '')
    +'<div class="sc-head"><span class="card-title">✅ Compra #'+compra.id+' registrada</span>'
    +'<div style="display:flex;gap:8px">'
    +'<button class="btn-secondary" onclick="imprimirComprobante('+compra.id+')">🖨️ Imprimir comprobante</button>'
    +'<button class="btn-primary" onclick="nuevaCompraDesdeComprobante()">+ Nueva compra</button>'
    +'</div></div>'
    +comprobanteResumenHTML(compra)
    +'</div>';
}

function comprobanteResumenHTML(compra) {
  const items = compra.items||[];
  return '<div class="form-row">'
    +'<div class="form-col"><label>Proveedor</label><div style="font-weight:700;padding-top:4px">'+compra.proveedor_nombre+'</div></div>'
    +'<div class="form-col"><label>Fecha recepción</label><div style="font-weight:700;padding-top:4px">'+fmtDate(compra.fecha_recepcion)+'</div></div>'
    +'<div class="form-col"><label>Nº Factura / Remito</label><div style="font-weight:700;padding-top:4px">'+(compra.numero_factura||'—')+' / '+(compra.numero_remito||'—')+'</div></div>'
    +'</div>'
    +'<div style="overflow-x:auto;margin-top:10px"><table class="data-table"><thead><tr>'
    +'<th>Producto</th><th>Cantidad</th><th>Costo unit.</th><th>Subtotal</th><th>Vínculo</th>'
    +'</tr></thead><tbody>'
    +items.map(it=>'<tr><td><strong>'+it.nombre+'</strong></td>'
      +'<td>'+it.cantidad+' '+(it.unidad||'u')+'</td>'
      +'<td>'+fmt(it.costo_unitario)+'</td>'
      +'<td style="font-weight:700">'+fmt(it.subtotal)+'</td>'
      +'<td>'+(it.producto_id ? '<span class="pill pg">📦 Stock</span>' : '<span class="pill pgr">Libre</span>')+'</td></tr>').join('')
    +'</tbody></table></div>'
    +'<div class="total-box"><span class="lbl">Total</span><span class="val">'+fmt(compra.total)+'</span></div>';
}

async function imprimirComprobante(compraId) {
  let compra = G.comprobante && G.comprobante.id===compraId ? G.comprobante : null;
  if (!compra) {
    const r = await api('GET','/compras/'+compraId);
    if (r.error) return toast(r.error, false);
    compra = r;
  }
  const anulada = compra.estado === 'anulada';
  const items = compra.items||[];
  const fecha = new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

  const filas = items.map(it => `<tr>
    <td style="padding:7px 10px;border-bottom:1px solid #f1f5f9"><strong>${it.nombre}</strong>${it.producto_id?'':' <span style="color:#94a3b8;font-size:10px">(no vinculado a stock)</span>'}</td>
    <td style="padding:7px 10px;border-bottom:1px solid #f1f5f9">${it.cantidad} ${it.unidad||'u'}</td>
    <td style="padding:7px 10px;border-bottom:1px solid #f1f5f9">${fmt(it.costo_unitario)}</td>
    <td style="padding:7px 10px;border-bottom:1px solid #f1f5f9;font-weight:700">${fmt(it.subtotal)}</td>
  </tr>`).join('');

  const html = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
  <title>Compra #${compra.id} — Hotel Takuá</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;font-size:12px;color:#1a2035;padding:20px}
    h1{font-size:17px;font-weight:900;margin-bottom:2px}
    .sub{font-size:11px;color:#64748b;margin-bottom:14px}
    .anulada{background:#fee2e2;border:1.5px solid #fca5a5;border-radius:8px;padding:10px 14px;margin-bottom:14px;color:#dc2626;font-weight:800}
    .datos{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-bottom:16px;font-size:12px}
    .datos b{color:#64748b;text-transform:uppercase;font-size:9px;display:block;margin-bottom:1px}
    table{width:100%;border-collapse:collapse;margin-bottom:10px}
    th{text-align:left;padding:7px 10px;font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid #1a2035}
    .total{text-align:right;font-size:15px;font-weight:900;padding:8px 10px}
    .firma{margin-top:50px;display:flex;justify-content:space-between;gap:40px}
    .firma div{flex:1;border-top:1px solid #1a2035;padding-top:6px;font-size:10px;color:#64748b;text-align:center}
    @page{margin:14mm}
  </style>
  </head><body>
  <h1>🛒 Comprobante de Compra — Hotel Takuá</h1>
  <div class="sub">Compra #${compra.id} · Generado ${fecha}</div>
  ${anulada?`<div class="anulada">⚠️ COMPROBANTE ANULADO${compra.motivo_anulacion?' — '+compra.motivo_anulacion:''}</div>`:''}
  <div class="datos">
    <div><b>Proveedor</b>${compra.proveedor_nombre}</div>
    <div><b>Fecha de recepción</b>${fmtDate(compra.fecha_recepcion)}</div>
    <div><b>Nº Factura</b>${compra.numero_factura||'—'}</div>
    <div><b>Nº Remito</b>${compra.numero_remito||'—'}</div>
    <div><b>Fecha de emisión</b>${fmtDate(compra.fecha_emision)}</div>
    <div><b>Cargado por</b>${compra.usuario_nombre||'—'}</div>
  </div>
  ${compra.observaciones?`<div class="datos"><div style="grid-column:1/-1"><b>Observaciones</b>${compra.observaciones}</div></div>`:''}
  <table>
    <thead><tr><th>Producto</th><th>Cantidad</th><th>Costo unit.</th><th>Subtotal</th></tr></thead>
    <tbody>${filas}</tbody>
  </table>
  <div class="total">TOTAL: ${fmt(compra.total)}</div>
  <div class="firma">
    <div>Recibido por</div>
    <div>Firma / Aclaración</div>
  </div>
  <div style="margin-top:20px;font-size:9px;color:#94a3b8;text-align:center">Hotel Takuá · Documento generado por el sistema de gestión · ${fecha}</div>
  </body></html>`;

  const id = 'compra-print-frame';
  let frame = document.getElementById(id);
  if (!frame) {
    frame = document.createElement('iframe');
    frame.id = id;
    frame.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:0;height:0;border:none';
    document.body.appendChild(frame);
  }
  frame.srcdoc = html;
  frame.onload = () => { frame.contentWindow.focus(); frame.contentWindow.print(); };
}

// ══════════════════════════════════════════════════════
// TAB: HISTORIAL
// ══════════════════════════════════════════════════════
async function renderTabHistorial(el) {
  el.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8">⏳ Cargando historial...</div>';
  const params = new URLSearchParams();
  if (G.filtroDesde) params.set('desde', G.filtroDesde);
  if (G.filtroHasta) params.set('hasta', G.filtroHasta);
  if (G.filtroProveedor) params.set('proveedor_id', G.filtroProveedor);
  if (G.filtroEstado) params.set('estado', G.filtroEstado);
  const r = await api('GET','/compras?'+params.toString());
  G.historial = Array.isArray(r) ? r : [];

  const optsProveedor = G.proveedores.map(p=>'<option value="'+p.id+'" '+(String(G.filtroProveedor)===String(p.id)?'selected':'')+'>'+p.nombre+'</option>').join('');

  const rows = G.historial.map(c => {
    const anulada = c.estado === 'anulada';
    return '<tr>'
      +'<td>'+fmtDate(c.fecha_recepcion)+'</td>'
      +'<td><strong>'+c.proveedor_nombre+'</strong></td>'
      +'<td style="color:#64748b">'+(c.numero_factura||'—')+' / '+(c.numero_remito||'—')+'</td>'
      +'<td>'+c.cantidad_items+'</td>'
      +'<td style="font-weight:700">'+fmt(c.total)+'</td>'
      +'<td>'+(anulada?'<span class="pill pr">Anulada</span>':'<span class="pill pg">Confirmada</span>')+'</td>'
      +'<td><div style="display:flex;gap:5px;flex-wrap:wrap">'
      +'<button class="btn-sm" style="background:#f3f4f6;color:#374151" onclick="imprimirComprobante('+c.id+')">🖨️ Reimprimir</button>'
      +(IS_ADMIN && !anulada ? '<button class="btn-sm" style="background:#fee2e2;color:#dc2626" onclick="modalAnular('+c.id+')">🗑️ Anular</button>' : '')
      +'</div></td></tr>';
  }).join('');

  el.innerHTML = '<div class="section-card">'
    +'<div class="sc-head"><span class="card-title">Historial de compras ('+G.historial.length+')</span></div>'
    +'<div class="form-row">'
    +'<div class="form-col"><label>Desde</label><input type="date" value="'+G.filtroDesde+'" onchange="setFiltroHist(\'filtroDesde\',this.value)"></div>'
    +'<div class="form-col"><label>Hasta</label><input type="date" value="'+G.filtroHasta+'" onchange="setFiltroHist(\'filtroHasta\',this.value)"></div>'
    +'<div class="form-col"><label>Proveedor</label><select onchange="setFiltroHist(\'filtroProveedor\',this.value)"><option value="">Todos</option>'+optsProveedor+'</select></div>'
    +'<div class="form-col"><label>Estado</label><select onchange="setFiltroHist(\'filtroEstado\',this.value)">'
    +'<option value="">Todos</option><option value="confirmada" '+(G.filtroEstado==='confirmada'?'selected':'')+'>Confirmada</option>'
    +'<option value="anulada" '+(G.filtroEstado==='anulada'?'selected':'')+'>Anulada</option></select></div>'
    +'</div>'
    +'<div style="overflow-x:auto"><table class="data-table"><thead><tr>'
    +'<th>Recepción</th><th>Proveedor</th><th>Factura / Remito</th><th>Ítems</th><th>Total</th><th>Estado</th><th>Acciones</th>'
    +'</tr></thead><tbody>'
    +(rows||'<tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:32px">Sin compras registradas</td></tr>')
    +'</tbody></table></div>'
    +'</div>';
}

function setFiltroHist(campo, val) { G[campo] = val; renderTab(); }

function modalAnular(compraId) {
  openModal('<div class="modal-hd"><h3>🗑️ Anular compra #'+compraId+'</h3><button class="modal-close" onclick="closeModal()">✕</button></div>'
    +'<p style="font-size:13px;color:#64748b;margin-bottom:14px">Se revertirá el stock de los ítems vinculados a inventario. Esta acción queda registrada y no se puede deshacer.</p>'
    +'<div class="form-col"><label>Motivo de la anulación *</label><textarea id="anular-motivo" placeholder="Ej: se cargó por error, mercadería devuelta al proveedor..."></textarea></div>'
    +'<button class="confirm-btn" style="background:linear-gradient(135deg,#dc2626,#ef4444)" onclick="confirmarAnular('+compraId+')">Confirmar anulación</button>');
}

async function confirmarAnular(compraId) {
  const motivo = document.getElementById('anular-motivo').value.trim();
  if (!motivo) return toast('El motivo es obligatorio', false);
  const r = await api('POST','/compras/'+compraId+'/anular', { motivo });
  if (r.error) return toast(r.error, false);
  toast('Compra #'+compraId+' anulada');
  closeModal();
  renderTab();
}

// ══════════════════════════════════════════════════════
// TAB: PROVEEDORES
// ══════════════════════════════════════════════════════
function renderTabProveedores(el) {
  const rows = G.proveedores.map(p => '<tr>'
    +'<td><strong>'+p.nombre+'</strong></td>'
    +'<td style="color:#64748b">'+(p.cuit||'—')+'</td>'
    +'<td style="color:#64748b">'+(p.telefono||'—')+'</td>'
    +'<td style="color:#64748b">'+(p.email||'—')+'</td>'
    +'<td>'+(IS_ADMIN ? '<div style="display:flex;gap:5px">'
      +'<button class="btn-sm" style="background:#eff6ff;color:#2563eb" onclick="modalEditarProveedor('+p.id+')">✏️</button>'
      +'<button class="btn-sm" style="background:#fee2e2;color:#dc2626" onclick="confirmarBajaProveedor('+p.id+',\''+p.nombre.replace(/'/g,"\\'")+'\')">🗑️</button>'
      +'</div>' : '—')
    +'</td></tr>').join('');

  el.innerHTML = '<div class="section-card">'
    +'<div class="sc-head"><span class="card-title">Proveedores ('+G.proveedores.length+')</span>'
    +(IS_ADMIN ? '<button class="btn-primary" onclick="modalNuevoProveedor(false)">+ Nuevo proveedor</button>' : '')
    +'</div>'
    +'<div style="overflow-x:auto"><table class="data-table"><thead><tr>'
    +'<th>Nombre</th><th>CUIT</th><th>Teléfono</th><th>Email</th><th>Acciones</th>'
    +'</tr></thead><tbody>'
    +(rows||'<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:32px">Sin proveedores cargados</td></tr>')
    +'</tbody></table></div>'
    +'</div>';
}

function modalNuevoProveedor(volverANueva) {
  openModal('<div class="modal-hd"><h3>+ Nuevo proveedor</h3><button class="modal-close" onclick="closeModal()">✕</button></div>'
    +'<div class="form-col" style="margin-bottom:10px"><label>Nombre *</label><input id="pv-nombre" placeholder="Distribuidora..."></div>'
    +'<div class="form-row">'
    +'<div class="form-col"><label>CUIT</label><input id="pv-cuit" placeholder="20-12345678-9"></div>'
    +'<div class="form-col"><label>Teléfono</label><input id="pv-tel" placeholder="+54 9 ..."></div>'
    +'</div>'
    +'<div class="form-col" style="margin-bottom:10px"><label>Email</label><input id="pv-email" placeholder="contacto@proveedor.com"></div>'
    +'<div class="form-col"><label>Notas</label><textarea id="pv-notas" placeholder="Opcional"></textarea></div>'
    +'<button class="confirm-btn" onclick="guardarProveedor(null,'+!!volverANueva+')">Guardar proveedor</button>');
}

function modalEditarProveedor(id) {
  const p = G.proveedores.find(x=>x.id===id); if (!p) return;
  openModal('<div class="modal-hd"><h3>✏️ Editar proveedor</h3><button class="modal-close" onclick="closeModal()">✕</button></div>'
    +'<div class="form-col" style="margin-bottom:10px"><label>Nombre *</label><input id="pv-nombre" value="'+p.nombre.replace(/"/g,'&quot;')+'"></div>'
    +'<div class="form-row">'
    +'<div class="form-col"><label>CUIT</label><input id="pv-cuit" value="'+(p.cuit||'')+'"></div>'
    +'<div class="form-col"><label>Teléfono</label><input id="pv-tel" value="'+(p.telefono||'')+'"></div>'
    +'</div>'
    +'<div class="form-col" style="margin-bottom:10px"><label>Email</label><input id="pv-email" value="'+(p.email||'')+'"></div>'
    +'<div class="form-col"><label>Notas</label><textarea id="pv-notas">'+(p.notas||'')+'</textarea></div>'
    +'<button class="confirm-btn" onclick="guardarProveedor('+id+',false)">Guardar cambios</button>');
}

async function guardarProveedor(id, volverANueva) {
  const nombre = document.getElementById('pv-nombre').value.trim();
  if (!nombre) return toast('El nombre es obligatorio', false);
  const body = {
    nombre,
    cuit: document.getElementById('pv-cuit').value.trim(),
    telefono: document.getElementById('pv-tel').value.trim(),
    email: document.getElementById('pv-email').value.trim(),
    notas: document.getElementById('pv-notas').value.trim(),
  };
  const r = id ? await api('PUT','/proveedores/'+id, body) : await api('POST','/proveedores', body);
  if (r.error) return toast(r.error, false);
  toast(id ? 'Proveedor actualizado' : 'Proveedor creado');
  closeModal();
  if (volverANueva && r.id) G.proveedorSeleccionado = r.id;
  await loadBase();
  renderTab();
}

function confirmarBajaProveedor(id, nombre) {
  openModal('<div class="modal-hd"><h3>🗑️ Dar de baja proveedor</h3><button class="modal-close" onclick="closeModal()">✕</button></div>'
    +'<p style="font-size:13px;color:#64748b;margin-bottom:16px">"'+nombre+'" dejará de aparecer en los listados, pero las compras ya cargadas con este proveedor no se ven afectadas.</p>'
    +'<button class="confirm-btn" style="background:linear-gradient(135deg,#dc2626,#ef4444)" onclick="bajaProveedor('+id+')">Confirmar baja</button>');
}

async function bajaProveedor(id) {
  const r = await api('DELETE','/proveedores/'+id);
  if (r.error) return toast(r.error, false);
  toast('Proveedor dado de baja');
  closeModal();
  await loadBase();
  renderTab();
}

// ── INIT ──────────────────────────────────────────────
render();
</script>
<script src="/sidebar.js"></script>
</body>
